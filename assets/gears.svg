<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 95" width="140" height="95" role="img" aria-label="Animated silver gears">
  <defs>
    <radialGradient id="silver" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c7ccd3"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </radialGradient>

    <linearGradient id="dark-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#aeb4bd"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>

    <style>
      .gear {
        transform-box: fill-box;
        transform-origin: center;
      }

      .clockwise {
        animation: spin 4.5s linear infinite;
      }

      .counter {
        animation: spin-reverse 3.2s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes spin-reverse {
        to {
          transform: rotate(-360deg);
        }
      }
    </style>

    <g id="large-gear-shape">
      <rect x="-5" y="-34" width="10" height="16" rx="1"/>
      <rect x="-5" y="18" width="10" height="16" rx="1"/>
      <rect x="-34" y="-5" width="16" height="10" rx="1"/>
      <rect x="18" y="-5" width="16" height="10" rx="1"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(30)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(60)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(120)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(150)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(210)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(240)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(300)"/>
      <rect x="-5" y="-34" width="10" height="16" rx="1" transform="rotate(330)"/>
      <circle r="24"/>
      <circle r="15" fill="#111827"/>
      <circle r="8" fill="#f9fafb"/>
    </g>

    <g id="small-gear-shape">
      <rect x="-4" y="-23" width="8" height="11" rx="1"/>
      <rect x="-4" y="12" width="8" height="11" rx="1"/>
      <rect x="-23" y="-4" width="11" height="8" rx="1"/>
      <rect x="12" y="-4" width="11" height="8" rx="1"/>
      <rect x="-4" y="-23" width="8" height="11" rx="1" transform="rotate(45)"/>
      <rect x="-4" y="-23" width="8" height="11" rx="1" transform="rotate(90)"/>
      <rect x="-4" y="-23" width="8" height="11" rx="1" transform="rotate(135)"/>
      <rect x="-4" y="-23" width="8" height="11" rx="1" transform="rotate(225)"/>
      <rect x="-4" y="-23" width="8" height="11" rx="1" transform="rotate(270)"/>
      <rect x="-4" y="-23" width="8" height="11" rx="1" transform="rotate(315)"/>
      <circle r="16"/>
      <circle r="9" fill="#111827"/>
      <circle r="5" fill="#f9fafb"/>
    </g>
  </defs>

  <rect width="140" height="95" fill="none"/>

  <g transform="translate(49 57)">
    <g class="gear clockwise" fill="url(#silver)" stroke="#111827" stroke-width="2">
      <use href="#large-gear-shape"/>
    </g>
  </g>

  <g transform="translate(91 30)">
    <g class="gear counter" fill="url(#dark-silver)" stroke="#111827" stroke-width="2">
      <use href="#small-gear-shape"/>
    </g>
  </g>

  <g transform="translate(98 68)">
    <g class="gear counter" fill="url(#dark-silver)" stroke="#111827" stroke-width="2">
      <use href="#small-gear-shape"/>
    </g>
  </g>
</svg>
