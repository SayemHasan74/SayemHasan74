<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="GitHub activity overview chart">
  <defs>
    <style>
      .label {
        fill: #57606a;
        font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .value {
        fill: #24292f;
        font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .axis {
        stroke: #1a7f37;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .area {
        fill: #2da44e;
        fill-opacity: 0.35;
        stroke: #2da44e;
        stroke-width: 3;
        stroke-linejoin: round;
      }

      .point {
        fill: #ffffff;
        stroke: #1a7f37;
        stroke-width: 3;
      }

      @media (prefers-color-scheme: dark) {
        .label {
          fill: #8b949e;
        }

        .value {
          fill: #c9d1d9;
        }
      }
    </style>
  </defs>

  <rect width="720" height="300" fill="none"/>

  <line class="axis" x1="360" y1="40" x2="360" y2="260"/>
  <line class="axis" x1="250" y1="150" x2="470" y2="150"/>

  <polygon class="area" points="360,148 285,150 360,195 364,150 360,148"/>

  <circle class="point" cx="360" cy="148" r="6"/>
  <circle class="point" cx="285" cy="150" r="6"/>
  <circle class="point" cx="360" cy="195" r="6"/>
  <circle class="point" cx="364" cy="150" r="6"/>
  <circle class="point" cx="360" cy="150" r="5"/>

  <text class="value" x="360" y="18" text-anchor="middle">2%</text>
  <text class="label" x="360" y="38" text-anchor="middle">Code review</text>

  <text class="value" x="220" y="155" text-anchor="end">68%</text>
  <text class="label" x="220" y="176" text-anchor="end">Commits</text>

  <text class="value" x="500" y="155" text-anchor="start">2%</text>
  <text class="label" x="500" y="176" text-anchor="start">Issues</text>

  <text class="value" x="360" y="282" text-anchor="middle">28%</text>
  <text class="label" x="360" y="302" text-anchor="middle">Pull requests</text>
</svg>
